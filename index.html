<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book Now – Yidi Muse Beauty</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:wght@400;600;700&display=swap">
<style>
:root{--bg:#fff;--card:#fff;--ink:#111;--mute:#6b6963;--red:#b3362b;--line:#cfccc4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 "Cormorant Garamond",Georgia,serif}
.wrap{max-width:560px;margin:0 auto;padding:28px 20px 56px}
.logo{display:block;width:78%;max-width:340px;margin:0 auto 4px}
h1{color:var(--red);font-family:"Pinyon Script","Snell Roundhand",cursive;font-weight:400;font-size:46px;line-height:1.1;text-align:center;margin:6px 0 0}
.tag{text-align:center;letter-spacing:3px;text-transform:uppercase;font-weight:600;font-size:15px;margin:6px 0 4px}
.sub{text-align:center;color:var(--mute);margin:0 0 8px}
h2{font-size:15px;letter-spacing:2.5px;text-transform:uppercase;margin:28px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--ink)}
.tar{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.tar small{display:block;color:var(--mute);font-size:16px}
.tar b{font-size:20px}
.note{color:var(--red);font-weight:600;text-align:center;margin:10px 0 0;font-size:16px;letter-spacing:1px;text-transform:uppercase}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;margin-bottom:10px;font-size:15px;letter-spacing:1px;text-transform:uppercase}
input,select{display:block;width:100%;margin-top:4px;padding:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:18px "Cormorant Garamond",Georgia,serif;border-radius:0}
.pers{border:1px solid var(--line);padding:12px;margin-bottom:10px}
.pers b{display:block;margin-bottom:8px;letter-spacing:1px;text-transform:uppercase;font-size:15px;color:var(--red)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{padding:10px 0;text-align:center;border:1px solid var(--line);background:var(--card);color:inherit;font:inherit;cursor:pointer}
.slot small{display:block;color:var(--mute);font-size:14px}
.on{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.info{grid-column:1/-1;color:var(--mute);text-align:center}
.tot{margin-top:18px;padding:14px;border:1px solid var(--ink);text-align:center}
.tot b{font-size:22px}
.go,.btn{display:block;width:100%;margin-top:14px;padding:15px;border:0;text-align:center;text-decoration:none;font:600 17px "Cormorant Garamond",Georgia,serif;letter-spacing:2px;text-transform:uppercase;cursor:pointer}
.go{background:var(--ink);color:var(--bg)}
.go:disabled{opacity:.4;cursor:not-allowed}
.btn{background:var(--red);color:#fff}
.btn.alt{background:none;color:var(--red);border:1px solid var(--red)}
#res{display:none;margin-top:24px;padding:18px;border:1px solid var(--line)}
#res pre{white-space:pre-wrap;font:inherit;padding:12px;border:1px dashed var(--line)}
</style>
</head>

var BOOKED=[      // rdv déjà pris : colle ici les lignes reçues dans chaque mail de réservation
  // {d:"2026-10-12",s:"09:00"},
];
// =====================
var SERVICES=[
 {n:"Make up Naturel",d:"Léger & naturel · regard discret",p:20},
 {n:"Makeup Soft",d:"Élégant & lumineux · regard nude",p:30},
 {n:"Make up Glam",d:"Intense & sophistiqué · regard glamour",p:40}];
var DAY0=480,DAY1=1140,DUR=120,MAXD=3;
var $=function(i){return document.getElementById(i)};
function hh(x){return("0"+Math.floor(x/60)).slice(-2)+":"+("0"+x%60).slice(-2)}
function mn(t){var a=t.split(":");return +a[0]*60+ +a[1]}
function cap(st){st=st.slice().sort(function(a,b){return a-b});var c=st.length,pv=DAY0;st.forEach(function(s){c+=Math.floor((s-pv)/DUR);pv=s+DUR});return c+Math.floor((DAY1-pv)/DUR)}
function free(d,ex){var st=BOOKED.concat(ex||[]).filter(function(b){return b.d==d}).map(function(b){return mn(b.s)}),o=[];
 if(st.length>=MAXD)return o;
 for(var s=DAY0;s+DUR<=DAY1;s+=30){if(st.some(function(x){return Math.abs(x-s)<DUR}))continue;if(cap(st.concat(s))>=MAXD)o.push(s)}return o}

SERVICES.forEach(function(s){var d=document.createElement("div");d.className="tar";
 var l=document.createElement("span");l.textContent=s.n;var sm=document.createElement("small");sm.textContent=s.d;l.appendChild(sm);
 var p=document.createElement("b");p.textContent=s.p+"€";d.appendChild(l);d.appendChild(p);$("tar").appendChild(d)});

var tm=new Date();tm.setDate(tm.getDate()+1);var MIN=tm.toISOString().slice(0,10);
function blocks(){return[].slice.call($("pers").children)}
function dv(b){return b.querySelector(".pd").value}
function mk(i){var d=document.createElement("div");d.className="pers";d.pick=null;
 d.innerHTML='<b>Personne '+(i+1)+(i?'':' (toi)')+'</b><div class="row"><label>Prénom<input class="pn"></label><label>Nom<input class="pnm"></label></div>'
 +'<label>Prestation souhaitée<select class="pt"><option>Invitée</option><option>Demoiselles d\'honneur</option><option>Anniversaire</option><option>Autre</option></select></label>'
 +'<label>Make up souhaité<select class="pm">'+SERVICES.map(function(s,k){return'<option value="'+k+'">'+s.n+' — '+s.p+'€</option>'}).join('')+'</select></label>'
 +'<label>Date<input type="date" class="pd"></label><div class="slots ps"></div>';
 d.querySelector(".pd").min=MIN;return d}
function persons(){var n=Math.max(1,Math.min(6,+$("nb").value||1)),c=$("pers"),ch=false;
 while(c.children.length<n){c.appendChild(mk(c.children.length));ch=true}
 while(c.children.length>n){c.removeChild(c.lastChild);ch=true}return ch}
function refresh(){var bl=blocks();bl.forEach(function(b){
 var d=dv(b),c=b.querySelector(".ps"),ex=[];
 bl.forEach(function(o){if(o!==b&&o.pick!=null&&dv(o))ex.push({d:dv(o),s:hh(o.pick)})});
 var f=d&&d>=MIN?free(d,ex):[];
 if(b.pick!=null&&f.indexOf(b.pick)<0)b.pick=null;
 c.innerHTML="";
 if(!f.length){var x=document.createElement("div");x.className="info";x.textContent=d?(d<MIN?"Cette date est passée, choisis une date à venir":"Journée clôturée : les rendez-vous de ce jour sont complets. Choisis une autre date."):"Choisis d'abord une date";c.appendChild(x);return}
 f.forEach(function(s){var k=document.createElement("button");k.className="slot"+(b.pick===s?" on":"");k.textContent=hh(s);
  var e=document.createElement("small");e.textContent="→ "+hh(s+DUR);k.appendChild(e);
  k.onclick=function(){b.pick=s;refresh();upd()};c.appendChild(k)})})}
function total(){var t=0;[].forEach.call(document.querySelectorAll(".pm"),function(s){t+=SERVICES[+s.value].p});return t}
function upd(){if(persons())refresh();var t=total();$("tt").textContent=t+"€";
 var ok=$("tel").value.trim()&&$("lieu").value.trim();
 [].forEach.call(document.querySelectorAll(".pn,.pnm"),function(x){if(!x.value.trim())ok=false});
 blocks().forEach(function(b){if(b.pick==null||!dv(b))ok=false});
 $("go").disabled=!ok}
document.addEventListener("input",upd);
document.addEventListener("change",function(e){if(e.target.classList.contains("pd")){e.target.closest(".pers").pick=null}refresh();upd()});
persons();refresh();upd();

$("go").onclick=function(){
 var t=total(),pn=document.querySelectorAll(".pn"),pnm=document.querySelectorAll(".pnm"),pt=document.querySelectorAll(".pt"),pm=document.querySelectorAll(".pm"),bl=blocks();
 var L=["• Téléphone : "+$("tel").value.trim(),"• Nombre de personnes : "+pm.length];
 for(var i=0;i<pm.length;i++){var s=SERVICES[+pm[i].value];L.push("• Personne "+(i+1)+" : "+pn[i].value.trim()+" "+pnm[i].value.trim().toUpperCase()+" — "+pt[i].value+" — "+s.n+" ("+s.p+"€) — "+new Date(dv(bl[i])+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})+" de "+hh(bl[i].pick)+" à "+hh(bl[i].pick+DUR))}
 L.push("• Lieu : "+$("lieu").value.trim(),"• Déplacement (à partir de 5€) : à régler à la fin de la prestation","• Total : "+t+"€");
 var m=L.join("\n"),g=$("go");g.disabled=true;g.textContent="Envoi…";$("msg").textContent=m;
 var data={_subject:"Nouvelle réservation – "+pn[0].value.trim()+" "+pnm[0].value.trim().toUpperCase(),_captcha:"false",_template:"box",Client:pn[0].value.trim()+" "+pnm[0].value.trim().toUpperCase(),Reservation:m};
 data.Bloquer_les_creneaux=bl.map(function(b){return'{d:"'+dv(b)+'",s:"'+hh(b.pick)+'"},'}).join("  ");
 var cm=$("cmail").value.trim();
 if(cm){data.email=cm;data._autoresponse="Merci ! Ta demande de réservation chez Yidi Muse Beauty est bien reçue. Je te réponds très vite pour confirmer ton rendez-vous."}
 function show(){$("res").style.display="block";$("res").scrollIntoView({behavior:"smooth"})}
 function fail(){g.disabled=false;g.textContent="Confirmer ma réservation";$("rt").textContent="Oups, l'envoi n'a pas marché";
  $("ok").textContent="Ta demande n'a pas pu être envoyée. Appuie de nouveau sur Confirmer ma réservation dans un instant.";show()}
 fetch("https://formsubmit.co/ajax/"+EMAIL,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(data)})
 .then(function(r){return r.json()}).then(function(j){
  if(j&&(j.success===true||j.success==="true")){g.textContent="Réservation confirmée ✓";$("rt").textContent="✅ Réservation confirmée !";$("ok").textContent="Merci ! Je te contacte très vite pour la suite.";show()}else fail()})
 .catch(fail);
};
</script>
</body>
</html>
